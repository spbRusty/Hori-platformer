<title>Стрим-платформер</title>
<style>

html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
canvas{width:100%;max-width:900px;max-height:70vh;aspect-ratio:16/9;background:#2b1d45;border-radius:10px}
#pad{display:flex;justify-content:space-between;width:100%;max-width:900px;padding:10px 12px;box-sizing:border-box}
#pad div{display:flex;gap:10px}
#pad button{width:64px;height:64px;font-size:26px;border:0;border-radius:50%;background:#ffffff26;color:var(--fg)}
#pad button:active{background:#ffffff55}
small{opacity:.6;margin-top:4px}
#map{display:none;position:fixed;inset:0;z-index:9;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 12px;overflow:auto;text-align:center}
#map h1{margin:0;font-size:clamp(19px,5.5vw,32px);letter-spacing:.12em;color:var(--fg)}
#map p{margin:0;font-size:13px;opacity:.6}
#path{position:relative;width:100%;max-width:560px;height:min(56vh,330px)}
#path svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#path line{stroke:#4a3775;stroke-width:2;vector-effect:non-scaling-stroke}
#path line.on{stroke:#ffd54a}
#path button{position:absolute;transform:translate(-50%,-50%);width:clamp(54px,16vw,80px);min-height:44px;padding:5px 2px;border:2px solid #7b5ea7;border-radius:12px;background:#2b1d45;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px;align-items:center;cursor:pointer}
#path button b{font-size:15px;line-height:1;color:#ffd54a}
#path button span{font-size:clamp(9px,2.6vw,12px);line-height:1.1;overflow-wrap:anywhere}
#path button i{font-style:normal;font-size:10px;line-height:1;opacity:.7}
#path button:not([disabled]):active{background:#5a3a6e}
#path button[disabled]{border-color:#4a3775;background:#1a1326;opacity:.4;cursor:not-allowed}
#fs{position:fixed;top:8px;right:8px;z-index:10;width:46px;height:46px;border:1px solid #7b5ea7;border-radius:12px;background:#2b1d45cc;color:var(--fg);font-size:19px;cursor:pointer}
body.menu #pad,body.menu small,body.menu canvas{visibility:hidden}
</style></head><body>

const cv=document.getElementById('c'),g=cv.getContext('2d');let GY=500,LH=560;

});
cv.addEventListener('pointerdown',()=>{if(state!='play')toMap()});
// --- звук: синтез, без файлов. До-мажорная пентатоника, мягкая атака 12мс
let AC,MASTER,MUTE=0;
function audio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)}catch(e){return}
 MASTER=AC.createGain();MASTER.gain.value=.16;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6000;MASTER.connect(lp);lp.connect(AC.destination)}
function n(f,d,g,type,delay,glide){if(!AC||MUTE)return;const a=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime+(delay||0);
 a.type=type||'sine';a.frequency.setValueAtTime(f,t);if(glide)a.frequency.exponentialRampToValueAtTime(f*glide,t+d);
 v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+d);
 a.connect(v);v.connect(MASTER);a.start(t);a.stop(t+d+.03)}
function swish(){if(!AC||MUTE)return;const L=AC.sampleRate*.13,b=AC.createBuffer(1,L,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*(1-i/L)*(1-i/L);
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain(),t=AC.currentTime;
 s.buffer=b;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(2800,t);f.frequency.exponentialRampToValueAtTime(650,t+.13);
 v.gain.value=.45;s.connect(f);f.connect(v);v.connect(MASTER);s.start(t)}
function snd(k){if(!AC||MUTE)return;
 if(k=='jump')n(587,.22,.5,'triangle',0,1.5);
 else if(k=='swing')swish();
 else if(k=='kill'){n(784,.12,.45,'triangle');n(1175,.26,.35,'sine',.06)}
 else if(k=='coin'){n(1047,.1,.3,'sine');n(1568,.2,.28,'sine',.05)}
 else if(k=='hurt')n(196,.3,.5,'sawtooth',0,.5);
 else if(k=='win'){[523,659,784,1047].forEach((f,i)=>n(f,.55,.3,'triangle',i*.09));n(2093,.75,.12,'sine',.36)}
 else if(k=='lose'){[392,370,330,247].forEach((f,i)=>n(f,.6,.28,'triangle',i*.14))}
 else if(k=='start'){[523,784].forEach((f,i)=>n(f,.4,.22,'sine',i*.08))}}

 {n:'Бонус',w:1800,h:520,gy:460,sky:['#4a2a5e','#c1418f'],fin:[1650,460],

     [1900,1200,240,14],[2220,1130,240,14],[1900,1060,240,14],[2220,990,240,14],[1900,920,240,14],[2220,850,240,14],[1900,780,240,14],[2220,710,240,14],[1900,640,240,14],[2220,570,240,14],[1900,500,240,14],[2220,430,240,14],
     [2380,510,240,14],[2560,590,240,14],[2740,670,240,14],[2920,750,240,14],[3100,830,240,14],[3280,910,240,14],[3460,990,240,14],[3640,1070,240,14],[3820,1150,240,14],[4000,1230,240,14],[4180,1310,240,14]],
  f:[[600,1306,80,1.8],[1400,1306,80,2],[2300,956,60,1.4],[2000,606,60,1.5],[2500,476,60,1.6],[3560,956,60,1.7],[4300,1306,80,2.1]]}];
const EDG=[[0,1],[0,2],[1,3],[2,3],[3,4],[3,5],[4,6],[5,6]]; // ветки карты
const NOD=[[9,50],[28,24],[28,76],[48,50],[68,26],[68,74],[88,50]]; // позиции узлов, %
const hats=["кринж","фу","ноль","уйди","лол","скуф","цирк"];
const say=["куда ты, ссыкло?","не суйся","иди в стрим","ты тут не свой","беги, клоун","слышь, отвали"]; // фразы, когда Валя пробегает мимо
let P,coins,foes,state,cam,camY,score,t=0,pops;
let L=LV[0],W=L.w,li=0,shake=0,done=[],best=[0,0,0,0,0,0,0];
const mapEl=document.getElementById('map'),pathEl=document.getElementById('path');
try{const d=localStorage.getItem('hori_done'),u=+localStorage.getItem('hori_unlocked');
 if(d!==null)done=d.split(',').map(Number);else if(u>0){for(let i=0;i<=u;i++)done.push(i);localStorage.removeItem('hori_unlocked')}
 best=(localStorage.getItem('hori_best')||'').split(',').map(Number);while(best.length<LV.length)best.push(0)}catch(e){}
function unl(i){return i==0||EDG.some(e=>e[1]==i&&done.indexOf(e[0])>=0)} // узел открыт, если пройден любой родитель
function save(){try{localStorage.setItem('hori_done',done.join(','));localStorage.setItem('hori_best',best.join(','))}catch(e){}}
function toMap(){
 state='map';document.body.classList.add('menu');mapEl.style.display='flex';pathEl.textContent='';
 const sv=document.createElementNS('http://www.w3.org/2000/svg','svg');
 sv.setAttribute('viewBox','0 0 100 100');sv.setAttribute('preserveAspectRatio','none');
 EDG.forEach(e=>{const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',NOD[e[0]][0]);l.setAttribute('y1',NOD[e[0]][1]);l.setAttribute('x2',NOD[e[1]][0]);l.setAttribute('y2',NOD[e[1]][1]);
  if(unl(e[1]))l.className='on';sv.append(l)});
 pathEl.append(sv);
 LV.forEach((lv,i)=>{const b=document.createElement('button'),un=unl(i);
  b.disabled=!un;b.style.left=NOD[i][0]+'%';b.style.top=NOD[i][1]+'%';
  b.innerHTML='<b>'+(i+1)+'</b><span>'+lv.n+'</span><i>'+(best[i]?best[i]+' ₽':'—')+'</i>';
  if(un)b.onclick=()=>reset(i);pathEl.append(b)});
}
function reset(i){
 li=i;L=LV[i];W=L.w;GY=L.gy;LH=L.h;
 P={x:60,y:L.sp?L.sp[1]:GY-44,w:24,h:44,vx:0,vy:0,f:1,on:0,atk:0,inv:0,hp:3,jp:0,lnd:0,kills:0};
 coins=[];foes=[];pops=[];score=0;state='play';cam=0;camY=0;shake=0;mapEl.style.display='none';document.body.classList.remove('menu');snd('start');
 L.p.slice(1).forEach(p=>{for(let i=0;i<2;i++)coins.push({x:p[0]+30+i*(p[2]-60)/1,y:p[1]-30,v:10*(1+i)})});
 L.f.forEach((f,i)=>foes.push({x:f[0],y:f[1],w:30,h:34,vx:f[3],d:i%2?1:-1,x0:f[0]-f[2],x1:f[0]+f[2],tx:hats[i%7],sh:-600}));
}
function pop(x,y,s,c){pops.push({x,y,s,c,l:50})}
function solid(o,py){ // one-way landing
 o.on=0;
 for(const p of L.p){
  if(o.x+o.w>p[0]&&o.x<p[0]+p[2]&&o.vy>=0&&py+o.h<=p[1]+2&&o.y+o.h>=p[1]){o.lnd=o.vy>2?10:o.lnd;o.y=p[1]-o.h;o.vy=0;o.on=1}
 }
}
function update(){
 t++;
 if(state!='play'){if(keys.Enter){keys.Enter=0;toMap()}return}
 const l=keys.ArrowLeft||keys.KeyA,r=keys.ArrowRight||keys.KeyD;
 P.vx=(r?1:0)*4-(l?1:0)*4;if(P.vx)P.f=P.vx>0?1:-1;
if((keys.Space||keys.ArrowUp||keys.KeyW)&&P.on){P.vy=-12.5;P.on=0;P.jp=20;snd('jump')}
if((keys.KeyX||keys.KeyJ)&&P.atk<=0){P.atk=18;snd('swing')}
 P.atk--;P.inv--;P.jp=Math.max(0,P.jp-1);P.lnd=Math.max(0,P.lnd-1);
 P.x=Math.max(0,Math.min(W-P.w,P.x+P.vx));
 const py=P.y;P.vy+=.65;P.y+=P.vy;solid(P,py);
 if(P.vx&&P.on&&Math.random()<.15)pops.push({x:P.x+3,y:P.y+42,s:'',c:'#e8dcff',l:22,d:1});
 // sword hitbox
 const hb=P.atk>0?{x:P.f>0?P.x+P.w:P.x-50,y:P.y-4,w:50,h:P.h}:null;
 for(const e of foes){
  if(e.dead)continue;
  e.x+=e.vx*e.d;if(e.x<e.x0)e.d=1;if(e.x>e.x1)e.d=-1;
  const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
if(hb&&hit(hb,e)){e.dead=1;const v=[50,100,150,200][Math.random()*4|0];score+=v;pop(e.x,e.y+24,'+'+v+'₽','#ffd54a');P.kills++;pops.push({x:e.x+15,y:e.y-18,s:P.kills%3?'В БАН':'В БАН НАХ**',st:1,rot:(Math.random()-.5)*.5,l:52});shake=5;snd('kill');continue}
if(P.inv<=0&&hit(P,e)){P.hp--;P.inv=70;P.vy=-7;P.x-=e.d*30;pops.push({x:P.x+12,y:P.y-12,s:e.tx+'!',st:1,c:'#5ce1e6',rot:(Math.random()-.5)*.4,l:44});snd('hurt');if(P.hp<=0){state='lose';snd('lose')}}
else if(Math.abs(P.x-e.x)<95&&Math.abs(P.y-e.y)<58&&t-e.sh>600){e.sh=t;pops.push({x:e.x,y:e.y-26,s:say[Math.random()*say.length|0],st:1,c:'#5ce1e6',rot:(Math.random()-.5)*.3,l:90})}
 }
 for(const c of coins){if(!c.g&&Math.abs(c.x-(P.x+12))<22&&Math.abs(c.y-(P.y+22))<32){c.g=1;score+=c.v;pop(c.x,c.y,'+'+c.v+'₽','#ffd54a');snd('coin')}}
 pops.forEach(p=>{p.y-=.8;p.l--});pops=pops.filter(p=>p.l>0);
 shake*=.8;
if(Math.abs(P.x+12-L.fin[0])<45&&Math.abs(P.y+P.h-L.fin[1])<80){state='win';snd('win');if(score>(best[li]||0))best[li]=score;if(done.indexOf(li)<0)done.push(li);save()}
  cam=Math.max(0,Math.min(W-800,P.x-300));camY=Math.max(0,Math.min(LH-450,P.y-260));
}

 const x=P.x,f=P.f,run=P.vx&&P.on?1:0,ph=t*.5;

 y-=Math.abs(Math.sin(ph))*2*run;
 const S='#f2c6a0',K='#1c1526',flip=P.jp>0&&!P.on,land=P.lnd/10;
 g.save();
 if(flip||run){g.translate(x+12,y+22);g.rotate(flip?(1-P.jp/20)*6.2832*f:.06*f);g.translate(-x-12,-y-22)}
 if(land){g.translate(x+12,y+44);g.scale(1+.25*land,1-.25*land);g.translate(-x-12,-y-44)}
// ноги: бедро кожа, гольфы тёмные
  [[x+7+Math.sin(ph)*5*run],[x+13+Math.sin(ph+Math.PI)*5*run]].forEach(l=>{const lx=l[0];

  g.fillStyle=S;g.fillRect(x+11,y+9,2,4); // шея
  rr(x+6,y-1,12,19,6,'#0e0e14'); // волосы каре
  g.fillStyle=S;g.beginPath();g.arc(x+12,y+8,5,0,7);g.fill();
  g.fillStyle='#0e0e14';g.beginPath();g.arc(x+12,y+5,5.5,Math.PI,0);g.fill();
  g.fillRect(x+(f>0?12:5),y+3,6,4);
  g.fillStyle='#222';g.fillRect(x+12+f*2,y+8,2,3);g.fillRect(x+12+f*4-(f>0?0:2),y+8,2,3);
 // меч
 g.save();g.translate(x+12+f*8,y+22);
 const a=P.atk>0?(-1.4+(18-P.atk)/18*2.6)*f:1.3*f;g.rotate(a);
 g.fillStyle='#8a5a2b';g.fillRect(-2,-4,4,8);g.fillStyle='#ffd54a';g.fillRect(-6,-6,12,3);
 g.fillStyle='#dfe9ff';g.fillRect(-2,-40,4,34);g.restore();
 g.restore();
 if(flip){const a=t*.35;g.fillStyle='#ffd54a';g.beginPath();g.arc(x+12+Math.cos(a)*15,y-3+Math.sin(a)*6,2.6,0,7);g.fill()}
 if(P.atk>10){g.strokeStyle='#ffffff88';g.lineWidth=3;g.beginPath();g.arc(x+12,y+22,42,f>0?-1.2:Math.PI-.8,f>0?.8:Math.PI+1.2);g.stroke()}
}
function hater(e){
 g.save();g.translate(e.x,e.y);
