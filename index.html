<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стрим-платформер</title>
<link rel="stylesheet" href="style.css"></head><body>
<div id="игр"><canvas id="c" width="800" height="450"></canvas>
  <div id="гайд"><span><b>←→</b>ходить</span><span><b>Пробел ×2</b>двойной прыжок</span><span><b>C</b>щит 100₽</span><span><b>F</b>полный экран</span><span><b>N</b>музыка</span><span><b>⇧N</b>громкость</span><span><b>M</b>звук</span><span><b>Esc</b>карта</span><span><b>👑</b>босс ждёт в финале</span></div>
  <div id="гром"><i></i><i></i><i></i><i></i><s>−</s><s>+</s></div>
  <div id="кнопки"><button id="муз" aria-label="Музыка">♪</button><button id="fs" aria-label="Полный экран">⛶</button></div>
</div>
<div id="pad"><div><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div><div><button data-k="KeyC">🛡</button><button data-k="Space">⤒</button></div></div>

<div id="map">
  <h1>СТРИМ-ПЛАТФОРМЕР</h1>
  <p>Выбери уровень</p>
  <div id="path"></div>
</div>

<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/save.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/physics.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/main.js"></script></body></html>
